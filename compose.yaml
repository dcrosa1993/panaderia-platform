version: "3.3"

services:
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:?Falta POSTGRES_USER}:${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD}@postgres.may.cu:5432/${POSTGRES_DB:?Falta POSTGRES_DB}?schema=public"
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://${POSTGRES_USER:?Falta POSTGRES_USER}:${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD}@postgres.may.cu:5432/${POSTGRES_DB:?Falta POSTGRES_DB}?schema=public"
      JWT_SECRET: "${JWT_SECRET:?Falta JWT_SECRET en .env.docker}"
      PORT: "3000"
      WEB_ORIGIN: "${WEB_ORIGIN:-http://localhost:8080}"
    ports:
      - "8032:3000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runtime
    restart: unless-stopped
    ports:
      - "8031:80"
    depends_on:
      api:
        condition: service_started
